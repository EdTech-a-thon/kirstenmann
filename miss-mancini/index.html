<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Miss Mancini | Learning Space</title>
    <style>
      :root { font-family: Arial, sans-serif; color: #19342d; background: #f7f4ed; }
      * { box-sizing: border-box; }
      body { margin: 0; }
      header { background: #19342d; color: #fffdf7; padding: 22px clamp(24px, 7vw, 96px); }
      header a { color: #d7e5d1; font-size: .9rem; text-decoration: none; }
      main { width: min(920px, 100%); margin: 0 auto; padding: clamp(48px, 9vw, 112px) 24px; }
      .eyebrow { color: #a04d2c; font-size: .8rem; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }
      h1 { font-family: Georgia, serif; font-size: clamp(3rem, 9vw, 6rem); line-height: .95; margin: 14px 0 24px; }
      .intro { max-width: 560px; color: #52665f; font-size: 1.2rem; line-height: 1.6; }
      section { margin-top: 56px; padding: 30px; border: 1px solid #d8d4c9; border-radius: 18px; background: #fffdf7; }
      h2 { font-family: Georgia, serif; font-size: 1.7rem; margin: 0 0 10px; }
      section p { margin: 0; color: #52665f; line-height: 1.6; }
    </style>
  </head>
  <body>
    <header><a href="/">Back to all learning spaces</a></header>
    <main>
      <div class="eyebrow">Personal learning space</div>
      <h1>Miss Mancini</h1>
      <p class="intro">Welcome to my classroom page. This is where we will share resources, updates, and everything our learners need.</p>
      <section>
        <h2>A space to grow</h2>
        <p>More classroom content is coming soon.</p>
      </section>
    </main>
  </body>
</html>
