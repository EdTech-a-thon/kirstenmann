<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jeu de memoire | Mme Lydia</title>
    <style>
      :root {
        font-family: Arial, sans-serif;
        color: #1d3340;
        background: #fff9ed;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        padding: 24px;
      }
      main {
        width: min(850px, 100%);
        margin: 0 auto;
      }
      .back {
        display: inline-block;
        margin-bottom: 28px;
        color: #1d5e6c;
        font-weight: 700;
      }
      header {
        padding: clamp(30px, 6vw, 58px);
        border-radius: 28px;
        background: #ffe5a6;
        text-align: center;
      }
      .eyebrow {
        margin: 0;
        color: #a64d2b;
        font-size: 0.8rem;
        font-weight: 700;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }
      h1 {
        margin: 12px 0;
        font-family: Georgia, serif;
        font-size: clamp(2.8rem, 8vw, 5rem);
        line-height: 1;
      }
      .intro {
        max-width: 550px;
        margin: 0 auto;
        color: #45606a;
        font-size: 1.1rem;
        line-height: 1.55;
      }
      .game {
        margin-top: 30px;
        padding: clamp(18px, 4vw, 30px);
        border: 2px solid #eadfc9;
        border-radius: 22px;
        background: #fffefb;
      }
      .status {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 22px;
        color: #45606a;
        font-weight: 700;
      }
      #message {
        min-height: 24px;
        margin: 0;
        color: #a64d2b;
        text-align: right;
      }
      .cards {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 14px;
      }
      .card {
        position: relative;
        aspect-ratio: 1 / 1.15;
        border: 0;
        border-radius: 16px;
        background: transparent;
        cursor: pointer;
        perspective: 700px;
      }
      .card:focus-visible {
        outline: 4px solid #1d5e6c;
        outline-offset: 3px;
      }
      .card-inner {
        position: absolute;
        inset: 0;
        transform-style: preserve-3d;
        transition: transform 0.35s;
      }
      .card.is-open .card-inner,
      .card.is-matched .card-inner {
        transform: rotateY(180deg);
      }
      .card-face {
        display: grid;
        position: absolute;
        inset: 0;
        place-items: center;
        padding: 8px;
        border-radius: 16px;
        backface-visibility: hidden;
        font-weight: 700;
        text-align: center;
      }
      .card-back {
        background: #1d5e6c;
        color: #fff;
        font-family: Georgia, serif;
        font-size: 2rem;
      }
      .card-front {
        border: 2px solid #eadfc9;
        background: #fdf7e8;
        color: #1d3340;
        font-size: clamp(0.85rem, 2.8vw, 1.15rem);
        line-height: 1.2;
        transform: rotateY(180deg);
      }
      .card.is-matched .card-front {
        background: #c9e7c5;
        border-color: #76ad70;
      }
      .controls {
        display: flex;
        justify-content: center;
        margin-top: 26px;
      }
      button.reset {
        padding: 12px 20px;
        border: 0;
        border-radius: 999px;
        background: #1d5e6c;
        color: white;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }
      button.reset:hover,
      button.reset:focus-visible {
        background: #123f4a;
        outline: 3px solid #ffe5a6;
        outline-offset: 3px;
      }
      @media (max-width: 520px) {
        body {
          padding: 16px;
        }
        .cards {
          grid-template-columns: repeat(3, 1fr);
          gap: 10px;
        }
        .status {
          align-items: flex-start;
          flex-direction: column;
        }
        #message {
          text-align: left;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <a class="back" href="/ms-tea/jeux/">Retour aux choix de jeux</a>
      <header>
        <p class="eyebrow">Jeu de memoire</p>
        <h1>Trouve les paires</h1>
        <p class="intro">
          Retourne deux cartes. Associe chaque expression en francais à son sens
          en anglais.
        </p>
      </header>
      <section class="game" aria-label="Jeu de memoire">
        <div class="status">
          <span>Paires trouvees : <span id="score">0</span> sur 5</span>
          <p id="message" aria-live="polite"></p>
        </div>
        <div class="cards" id="cards"></div>
        <div class="controls">
          <button class="reset" type="button" id="reset">
            Nouvelle partie
          </button>
        </div>
      </section>
    </main>
    <script>
      const pairs = [
        ["Salut !", "Hello!"],
        ["Bonjour", "Good morning!"],
        ["Bonsoir", "Good evening!"],
        ["Je m'appelle", "My name is"],
        ["Comment tu t'appelles ?", "What's your name?"],
      ];
      const cards = document.querySelector("#cards");
      const score = document.querySelector("#score");
      const message = document.querySelector("#message");
      let selected = [];
      let matched = 0;
      let waiting = false;

      function shuffle(items) {
        return [...items].sort(() => Math.random() - 0.5);
      }

      function startGame() {
        selected = [];
        matched = 0;
        waiting = false;
        score.textContent = "0";
        message.textContent = "";
        const gameCards = shuffle(
          pairs.flatMap(([french, english], pair) => [
            { word: french, pair },
            { word: english, pair },
          ]),
        );
        cards.innerHTML = gameCards
          .map(
            ({ word, pair }) => `
          <button class="card" type="button" data-pair="${pair}" aria-label="Carte cachee">
            <span class="card-inner">
              <span class="card-face card-back" aria-hidden="true">?</span>
              <span class="card-face card-front">${word}</span>
            </span>
          </button>
        `,
          )
          .join("");
      }

      cards.addEventListener("click", (event) => {
        const card = event.target.closest(".card");
        if (
          !card ||
          waiting ||
          card.classList.contains("is-open") ||
          card.classList.contains("is-matched")
        )
          return;
        card.classList.add("is-open");
        card.setAttribute(
          "aria-label",
          `Carte : ${card.querySelector(".card-front").textContent}`,
        );
        selected.push(card);
        if (selected.length !== 2) return;

        waiting = true;
        const [first, second] = selected;
        if (first.dataset.pair === second.dataset.pair) {
          first.classList.replace("is-open", "is-matched");
          second.classList.replace("is-open", "is-matched");
          matched += 1;
          score.textContent = matched;
          message.textContent =
            matched === pairs.length
              ? "Bravo ! Tu as trouve toutes les paires."
              : "Bonne paire !";
          selected = [];
          waiting = false;
          return;
        }

        message.textContent = "Essaie encore !";
        window.setTimeout(() => {
          first.classList.remove("is-open");
          second.classList.remove("is-open");
          first.setAttribute("aria-label", "Carte cachee");
          second.setAttribute("aria-label", "Carte cachee");
          selected = [];
          waiting = false;
        }, 850);
      });

      document.querySelector("#reset").addEventListener("click", startGame);
      startGame();
    </script>
  </body>
</html>
